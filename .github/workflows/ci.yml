name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match "builtin-baseline" in vcpkg.json.
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-format-18
      - name: Check formatting
        run: |
          git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run -Werror

  schema:
    name: JSON schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/schema/requirements.txt
      - run: pytest -q tests/schema

  linux:
    name: Linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-linux-gcc, ci-linux-clang, ci-linux-sanitizers]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/../vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build clang clang-tidy
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone -q https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout -q "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  windows:
    name: Windows MSVC
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\..\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-msvc-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          git clone -q https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout -q $env:VCPKG_COMMIT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure
        run: cmake --preset ci-windows-msvc
      - name: Build
        run: cmake --build --preset ci-windows-msvc
      - name: Test
        run: ctest --preset ci-windows-msvc

  python:
    # Python package raytatouille (libs/rtt-py, ADR 0002, ADR 0018): build in the CMake tree,
    # pytest incl. the bitwise comparison with C++ and mypy --strict via ctest; one smoke test
    # with pip install . per OS.
    name: Python ${{ matrix.python }} ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, preset: ci-linux-python, python: "3.10", cache: ci-linux-gcc, triplet: x64-linux, smoke: false }
          - { os: ubuntu-24.04, preset: ci-linux-python, python: "3.13", cache: ci-linux-gcc, triplet: x64-linux, smoke: true }
          - { os: windows-2022, preset: ci-windows-python, python: "3.13", cache: msvc, triplet: x64-windows, smoke: true }
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/../vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python }}
      - name: Install tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          # Same packages and compilers as the C++ jobs, so their cache is reused.
          key: vcpkg-${{ runner.os }}-${{ matrix.cache }}-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone -q https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout -q "$VCPKG_COMMIT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
      - name: Install Python build and test tools
        run: python -m pip install -r libs/rtt-py/tests/requirements.txt
      - name: Configure
        # The interpreter of setup-python explicitly: FindPython may otherwise pick another one
        # (Windows registry) without nanobind, numpy and pytest.
        run: cmake --preset ${{ matrix.preset }} "-DPython_EXECUTABLE=${{ steps.python.outputs.python-path }}"
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --target _core rtt_py_stub rtt_py_reference
      - name: Test (pytest, mypy)
        run: ctest --preset ${{ matrix.preset }} -R rtt_py
      - name: Smoke test pip install .
        if: matrix.smoke
        shell: bash
        env:
          # Triplet explicitly, independent of the generator platform (a Visual Studio developer
          # environment with Platform=x86 would make scikit-build-core configure Win32).
          CMAKE_ARGS: -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/../vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
        run: |
          python -m pip install . -v
          cd "$RUNNER_TEMP"
          python -c "import raytatouille as rt; print(rt.__version__, rt.__file__)"
          python -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/libs/rtt-py/tests"
