name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match "builtin-baseline" in vcpkg.json.
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  # Baseline of the relative benchmark check (#323): the current build may be at most 25 % slower.
  BENCH_BASE_TAG: v0.9.0

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 update -q && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y -q clang-format-18
      - name: Check formatting
        run: |
          git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run -Werror

  schema:
    name: JSON schema
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/schema/requirements.txt
      - run: pytest -q tests/schema tests/tools
      - name: Changelog fragments
        run: python tools/changelog.py check
      - name: One version in all places (#336)
        run: python tools/check_version.py

  linux:
    name: Linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-linux-gcc, ci-linux-clang, ci-linux-sanitizers]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/../vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 update -q && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y -q ninja-build clang clang-tidy
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone -q https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout -q "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      # FetchContent pin of pocketfft == vcpkg port at the baseline (ADR 0033, #204).
      - name: Check dependency pins
        if: matrix.preset == 'ci-linux-gcc'
        run: python3 tools/check_pins.py "$VCPKG_ROOT"
      # ci-linux-clang also builds the Python bindings, so that clang-tidy checks them (#336).
      - uses: actions/setup-python@v5
        if: matrix.preset == 'ci-linux-clang'
        id: python
        with:
          python-version: "3.13"
      - name: Install Python build and test tools
        if: matrix.preset == 'ci-linux-clang'
        run: python -m pip install -r libs/rtt-py/tests/requirements.txt
      - name: Configure
        # The interpreter of setup-python explicitly (see the Python job).
        run: >-
          cmake --preset ${{ matrix.preset }}
          ${{ matrix.preset == 'ci-linux-clang' && format('"-DPython_EXECUTABLE={0}"', steps.python.outputs.python-path) || '' }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      # Run-time measurement (#83): times in the job summary, a warning above 3 x the rough guide
      # of 10 ms for a spot of the Cooke triplet; never fails the job (runners vary).
      - name: Benchmark (warns only)
        if: matrix.preset == 'ci-linux-gcc'
        continue-on-error: true
        run: ./build/ci-linux-gcc/apps/rtt-bench/rtt_bench --runs 21 --github --summary "$GITHUB_STEP_SUMMARY"
      # Relative check (#323): the rtt_bench of BENCH_BASE_TAG (same preset and vcpkg baseline,
      # built once and cached with the reference files of that version) alternates with the
      # current one on this runner; the job fails if the spot of the Cooke triplet (1 thread) is
      # more than 25 % slower (tools/bench_compare.py).
      # The key names the compiler (a new GCC in the runner image rebuilds the baseline, so that
      # both builds use the same compiler) and a recipe counter (r1) for changes of the steps.
      - name: Compiler version for the baseline benchmark
        if: matrix.preset == 'ci-linux-gcc'
        id: gcc
        run: echo "version=$(g++ -dumpfullversion)" >> "$GITHUB_OUTPUT"
      - name: Restore the baseline benchmark
        if: matrix.preset == 'ci-linux-gcc'
        id: bench-base
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/../bench-base
          key: bench-base-r1-${{ env.BENCH_BASE_TAG }}-${{ runner.os }}-gcc${{ steps.gcc.outputs.version }}-${{ env.VCPKG_COMMIT }}
      - name: Build the baseline benchmark
        if: matrix.preset == 'ci-linux-gcc' && steps.bench-base.outputs.cache-hit != 'true'
        run: |
          git fetch -q --depth 1 origin "refs/tags/$BENCH_BASE_TAG:refs/tags/$BENCH_BASE_TAG"
          git worktree add -q ../rtt-base "$BENCH_BASE_TAG"
          cd ../rtt-base
          # No -Werror: the old sources need not be clean for a newer compiler on the runner.
          cmake --preset ci-linux-gcc -DRTT_BUILD_TESTS=OFF -DRTT_WARNINGS_AS_ERRORS=OFF
          cmake --build build/ci-linux-gcc --target rtt_bench
          mkdir -p ../bench-base/reference/m2 ../bench-base/catalogs/m2
          cp build/ci-linux-gcc/apps/rtt-bench/rtt_bench ../bench-base/
          cp tests/reference/m2/cooke_triplet.rtt.json ../bench-base/reference/m2/
          cp tests/catalogs/m2/schott.agf ../bench-base/catalogs/m2/
      # Saved right after the build, also when the comparison below fails.
      - name: Save the baseline benchmark
        if: matrix.preset == 'ci-linux-gcc' && steps.bench-base.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/../bench-base
          key: ${{ steps.bench-base.outputs.cache-primary-key }}
      - name: Benchmark against the baseline (fails above 1.25 x)
        if: matrix.preset == 'ci-linux-gcc'
        run: >-
          python3 tools/bench_compare.py
          --base ../bench-base/rtt_bench --base-name "$BENCH_BASE_TAG"
          --base-arg=--reference-dir --base-arg=../bench-base/reference
          --base-arg=--catalog-dir --base-arg=../bench-base/catalogs
          --new ./build/ci-linux-gcc/apps/rtt-bench/rtt_bench
          --rounds 7 --runs 21 --threshold 1.25 --github --summary "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows MSVC
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\..\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-msvc-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          git clone -q https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout -q $env:VCPKG_COMMIT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure
        run: cmake --preset ci-windows-msvc
      - name: Build
        run: cmake --build --preset ci-windows-msvc
      - name: Test
        run: ctest --preset ci-windows-msvc

  macos:
    # macOS 26 on arm64 (ADR 0047): Apple clang with libc++. The minimum version is 26.0
    # (std::from_chars for double), so the runner must be macOS 26 itself to run the tests.
    name: macOS ci-macos-clang
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/../vcpkg-cache
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ninja
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-ci-macos-clang-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone -q https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout -q "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure
        run: cmake --preset ci-macos-clang
      - name: Build
        run: cmake --build --preset ci-macos-clang
      - name: Test
        run: ctest --preset ci-macos-clang

  python:
    # Python package raytatouille (libs/rtt-py, ADR 0002, ADR 0018): build in the CMake tree,
    # pytest incl. the bitwise comparison with C++ and mypy --strict via ctest; one smoke test
    # with pip install . per OS, and the editable install over an editable install (#271) in every
    # job, also with Python 3.10 (stubgen needs typing_extensions there).
    name: Python ${{ matrix.python }} ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, preset: ci-linux-python, python: "3.10", cache: ci-linux-gcc, triplet: x64-linux, smoke: false, editable: true }
          - { os: ubuntu-24.04, preset: ci-linux-python, python: "3.13", cache: ci-linux-gcc, triplet: x64-linux, smoke: true, editable: true }
          - { os: windows-2022, preset: ci-windows-python, python: "3.13", cache: msvc, triplet: x64-windows, smoke: true, editable: true }
          - { os: macos-26, preset: ci-macos-python, python: "3.13", cache: ci-macos-clang, triplet: arm64-osx, smoke: true, editable: true }
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/../vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python }}
      - name: Install tools
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 update -q && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y -q ninja-build
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install ninja
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          # Same packages and compilers as the C++ jobs, so their cache is reused.
          key: vcpkg-${{ runner.os }}-${{ matrix.cache }}-${{ hashFiles('vcpkg.json') }}
      - name: Set up vcpkg
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone -q https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout -q "$VCPKG_COMMIT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
      - name: Install Python build and test tools
        run: python -m pip install -r libs/rtt-py/tests/requirements.txt
      - name: Configure
        # The interpreter of setup-python explicitly: FindPython may otherwise pick another one
        # (Windows registry) without nanobind, numpy and pytest.
        run: cmake --preset ${{ matrix.preset }} "-DPython_EXECUTABLE=${{ steps.python.outputs.python-path }}"
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --target _core rtt_py_stub rtt_py_reference rtt_cli
      - name: Test (pytest, mypy)
        run: ctest --preset ${{ matrix.preset }} -R rtt_py
      - name: Smoke test pip install .
        if: matrix.smoke
        shell: bash
        run: |
          # CMake reads backslashes in CMAKE_ARGS as escapes, so the Windows path gets forward
          # slashes. Triplet explicitly, independent of the generator platform (a Visual Studio
          # developer environment with Platform=x86 would make scikit-build-core configure Win32).
          toolchain="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          if [ "$RUNNER_OS" = "Windows" ]; then toolchain="$(cygpath -m "$toolchain")"; fi
          export CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$toolchain -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}"
          # macOS: wheel tag and minimum version 26.0 (ADR 0047), whatever the interpreter targets.
          if [ "$RUNNER_OS" = "macOS" ]; then export MACOSX_DEPLOYMENT_TARGET=26.0; fi
          echo "CMAKE_ARGS=$CMAKE_ARGS"
          python -m pip install . -v
          cd "$RUNNER_TEMP"
          python -c "import raytatouille as rt; print(rt.__version__, rt.__file__)"
          # The wheel has no command line rtt: test_cli.py runs through ctest (ADR 0052, point 8).
          python -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/libs/rtt-py/tests" \
            --ignore="$GITHUB_WORKSPACE/libs/rtt-py/tests/test_cli.py"
      - name: Examples of the user manual (#322)
        # The 25 examples of docs/handbuch/raytatouille-handbuch.tex against the package installed
        # by the smoke test, with the printed outputs compared character by character. Only on
        # macOS: the outputs come from macOS arm64 (ADR 0047), and results are bitwise equal only
        # per platform and compiler (ADR 0011). matplotlib comes from the test requirements.
        if: matrix.smoke && runner.os == 'macOS'
        timeout-minutes: 15
        shell: bash
        run: python tools/handbuch_beispiele.py
      - name: Editable install over an editable install (#271)
        if: matrix.editable
        shell: bash
        run: |
          # An editable install leaves a meta path finder in the environment (a .pth file loads it
          # at every interpreter start, also under pip's build isolation). The second build must
          # not import raytatouille through it while it writes _core.pyi (#271); before the fix it
          # failed there with ModuleNotFoundError numpy. The builds reuse build/skbuild.
          toolchain="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          if [ "$RUNNER_OS" = "Windows" ]; then toolchain="$(cygpath -m "$toolchain")"; fi
          export CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$toolchain -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}"
          # macOS: wheel tag and minimum version 26.0 (ADR 0047), whatever the interpreter targets.
          if [ "$RUNNER_OS" = "macOS" ]; then export MACOSX_DEPLOYMENT_TARGET=26.0; fi
          python -m venv "$RUNNER_TEMP/venv271"
          if [ "$RUNNER_OS" = "Windows" ]; then py="$RUNNER_TEMP/venv271/Scripts/python.exe"
          else py="$RUNNER_TEMP/venv271/bin/python"; fi
          "$py" -m pip install -q --upgrade pip
          # Import from outside the source tree, and content guard: a complete stub (#271).
          check_stub() {
            (cd "$RUNNER_TEMP"
             "$py" -c "import raytatouille as rt; from raytatouille._core import StokesPupil; print(rt.__version__, rt.__file__)"
             stub="$("$py" -c "import raytatouille, pathlib; print(pathlib.Path(raytatouille._core.__file__).with_name('_core.pyi'))")"
             grep -q 'class StokesPupil' "$stub"
             grep -q 'def yield_' "$stub")
          }
          "$py" -m pip install -e .
          "$py" -m pip install -e . --force-reinstall --no-deps
          check_stub
          # The same without build isolation (the workaround in #271), with the pinned build tools
          # from requirements.txt (ADR 0018).
          grep -E '^(nanobind|scikit-build-core|numpy)==' libs/rtt-py/tests/requirements.txt \
            > "$RUNNER_TEMP/build271.txt"
          "$py" -m pip install -q -r "$RUNNER_TEMP/build271.txt"
          "$py" -m pip install -e . --force-reinstall --no-deps --no-build-isolation
          check_stub
